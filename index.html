<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>

        <!-- Records -->
        <div class="panel-section rec-panel">
          <span class="label">TOP 5</span>
          <ol id="rec-list" class="rec-list"></ol>
          <div class="rec-stats">Mejor combo: <b id="rec-combo">0</b></div>
          <div class="rec-stats">Líneas máx: <b id="rec-lines">0</b></div>
          <button id="rec-reset" class="rec-reset" type="button">Resetear records</button>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <!-- Records -->
        <div id="rec-gameover" class="rec-over" hidden>
          <p id="rec-msg" class="rec-msg"></p>
          <div id="rec-form" class="rec-form" hidden>
            <input id="rec-name" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" />
            <button id="rec-save" type="button">Guardar</button>
          </div>
          <ol id="rec-list-over" class="rec-list"></ol>
          <div class="rec-stats">Mejor combo: <b id="rec-combo-over">0</b> · Líneas máx: <b id="rec-lines-over">0</b></div>
          <button id="rec-reset-over" class="rec-reset" type="button">Resetear records</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
